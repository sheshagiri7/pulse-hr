services:
  pulse-db:
    image: postgres:15
    container_name: pulse-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - pulse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  pulse-odoo:
    image: odoo:17
    container_name: pulse-odoo
    ports:
      - "8069:8069"
    depends_on:
      pulse-db:
        condition: service_healthy
    links:
      - pulse-db:db
    volumes:
      - ./addons:/mnt/extra-addons
      - pulse-odoo-data:/var/lib/odoo
    environment:
      - HOST=pulse-db
      - USER=odoo
      - PASSWORD=odoo
    restart: always

volumes:
  pulse-db-data:
  pulse-odoo-data:
