services:
  pulse-db:
    image: postgres:15
    container_name: pulse-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    restart: always

  pulse-odoo:
    image: odoo:17
    container_name: pulse-odoo
    ports:
      - "8069:8069"
    links:
      - pulse-db:db
    volumes:
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=pulse-db
      - USER=odoo
      - PASSWORD=odoo
    restart: always
