        position: absolute;

        15% { opacity: 0.6; }

    <!-- Background Canvas Animation Script -->
    <script>
      (function initBackgroundCanvas() {
        const canvas = document.getElementById('bg-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        function resize() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
          mouse.x = null;
          mouse.y = null;
        });

        const count = Math.min(75, Math.floor((width * height) / 17000));
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            size: Math.random() * 1.8 + 0.6,
            alpha: Math.random() * 0.45 + 0.15,
            pulseSpeed: Math.random() * 0.02 + 0.01,
            pulseOffset: Math.random() * Math.PI * 2
          });
        }

        let time = 0;
        function render() {
          ctx.clearRect(0, 0, width, height);
          time += 0.02;

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            if (mouse.x !== null && mouse.y !== null) {
              const dx = mouse.x - p.x;
              const dy = mouse.y - p.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (1 - dist / mouse.radius) * 1.2;
                p.x -= (dx / dist) * force;
                p.y -= (dy / dist) * force;
              }
            }

            const currentAlpha = p.alpha + Math.sin(time + p.pulseOffset) * 0.15;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, currentAlpha)})`;
            ctx.shadowBlur = 6;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
            ctx.fill();
            ctx.shadowBlur = 0;

            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 115) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                const lineAlpha = (1 - dist / 115) * 0.12;
                ctx.strokeStyle = `rgba(255, 255, 255, ${lineAlpha})`;
                ctx.lineWidth = 0.7;
                ctx.stroke();
              }
            }
          }

          requestAnimationFrame(render);
        }

        render();
      })();
    </script>

      // ==========================================
      // Attendance & Shift Analytics Spline Graph (Daily & Weekly)
      // ==========================================
      const AttendanceChart = () => {
        const [timeRange, setTimeRange] = useState('WEEKLY');
        const [hoveredIndex, setHoveredIndex] = useState(null);
        
        const [scrubber, setScrubber] = useState({
          active: false,
          x: 0,
          y: 0,
          value: 0,
        });

        const svgRef = useRef(null);
        const pathRef = useRef(null);

        const datasets = {
          'DAILY': {
            labels: ['09:00', '11:00', '13:00', '15:00', '17:00', '19:00'],
            path: 'M 20 180 C 80 170, 130 160, 180 130 C 240 90, 310 120, 380 75 C 450 35, 500 50, 540 45 C 580 40, 610 70, 640 85',
            fillPath: 'M 20 180 C 80 170, 130 160, 180 130 C 240 90, 310 120, 380 75 C 450 35, 500 50, 540 45 C 580 40, 610 70, 640 85 L 640 215 L 20 215 Z',
            points: [
              { x: 180, y: 130, label: '11:00', value: 92 },
              { x: 380, y: 75, label: '15:00', value: 96 },
              { x: 540, y: 45, label: '17:00 (Peak Duty)', value: 100, isPeak: true },
            ],
            peakIndex: 2,
            peakText: 'Shift Peak: 100%',
          },
          'WEEKLY': {
            labels: ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'],
            path: 'M 20 195 C 70 190, 110 193, 140 193 C 180 193, 210 178, 245 170 C 275 162, 300 145, 335 142 C 375 138, 410 142, 445 136 C 480 130, 500 52, 535 52 C 570 52, 600 110, 640 135',
            fillPath: 'M 20 195 C 70 190, 110 193, 140 193 C 180 193, 210 178, 245 170 C 275 162, 300 145, 335 142 C 375 138, 410 142, 445 136 C 480 130, 500 52, 535 52 C 570 52, 600 110, 640 135 L 640 215 L 20 215 Z',
            points: [
              { x: 140, y: 193, label: 'MON', value: 94 },
              { x: 245, y: 170, label: 'TUE', value: 96 },
              { x: 335, y: 142, label: 'WED', value: 97 },
              { x: 445, y: 136, label: 'THU', value: 98 },
              { x: 535, y: 52, label: 'FRI (Full Duty)', value: 100, isPeak: true },
            ],
            peakIndex: 4,
            peakText: 'Weekly Max: 100%',
          },
        };

        const currentData = datasets[timeRange];
        const peakPoint = currentData.points[currentData.peakIndex];

        const getPointOnPathAtX = (targetX) => {
          const path = pathRef.current;
          if (!path) return null;
          const totalLength = path.getTotalLength();
          let start = 0;
          let end = totalLength;
          let bestPt = path.getPointAtLength(0);

          for (let i = 0; i < 18; i++) {
            const mid = (start + end) / 2;
            const pt = path.getPointAtLength(mid);
            if (Math.abs(pt.x - targetX) < 0.5) {
              return pt;
            }
            if (pt.x < targetX) {
              start = mid;
            } else {
              end = mid;
            }
            bestPt = pt;
          }
          return bestPt;
        };

        const handlePointerMove = (e) => {
          if (!svgRef.current) return;
          const rect = svgRef.current.getBoundingClientRect();
          const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : null);
          if (clientX === null) return;

          const relativeX = (clientX - rect.left) / rect.width;
          const targetSvgX = Math.max(20, Math.min(640, relativeX * 660));

          const pt = getPointOnPathAtX(targetSvgX);
          if (pt) {
            const approxVal = Math.round(112 - (pt.y / 230) * 82);
            setScrubber({
              active: true,
              x: pt.x,
              y: pt.y,
              value: Math.max(30, Math.min(100, approxVal))
            });
          }
        };

        const handlePointerLeave = () => {
          setScrubber((prev) => ({ ...prev, active: false }));
        };

        return (
          <div 
            id="card-attendance-analytics"
            className="hover-pop bg-[#111218]/90 border border-[#20222c] rounded-2xl p-6 shadow-sm flex flex-col justify-between backdrop-blur-xs"
          >
            {/* Header with Title and Daily / Weekly Switcher */}
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <IconUserCheck className="w-5 h-5 text-emerald-400" />
                <h2 className="text-base sm:text-lg font-semibold text-white tracking-normal font-sans">
                  Attendance & Shift Telemetry
                </h2>
                <span className="text-[10px] font-mono text-zinc-500 hidden sm:inline-flex items-center gap-1 ml-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  Movable Telemetry
                </span>
              </div>

              {/* DAILY / WEEKLY Segmented Control */}
              <div 
                id="chart-range-selector"
                className="flex items-center bg-[#090a0f] border border-[#20222c] rounded-lg p-0.5"
              >
                {['DAILY', 'WEEKLY'].map((range) => {
                  const isSelected = timeRange === range;
                  return (
                    <button
                      key={range}
                      id={`btn-range-${range}`}
                      onClick={() => {
                        setTimeRange(range);
                        setScrubber((prev) => ({ ...prev, active: false }));
                      }}
                      className={`px-3.5 py-1 text-xs font-mono rounded-md font-semibold transition-all duration-150 border ${

                    {/* Lower Section: Attendance Spline Chart with Live Status Circle & Recent Activity */}
                    <section id="attendance-and-activity-section" className="grid grid-cols-1 lg:grid-cols-3 gap-5 items-stretch">
                      {/* Left 2 Cols: Attendance & Shift Telemetry Spline Graph + Round Gmail Option */}
                      <div className="lg:col-span-2 space-y-4">
                        <AttendanceChart />

                        {/* ROUND GMAIL OPTION BELOW GRAPH (Redirect to Google Gmail) */}
                        <div className="hover-pop flex items-center justify-between p-4 bg-[#111218]/95 border border-[#20222c] rounded-2xl shadow-xl backdrop-blur-md">
                          <div className="flex items-center gap-3.5">
                            {/* Round Circular Gmail Launcher with White Outline Pop-up */}
                            <a
                              id="btn-gmail-round"
                              href="https://mail.google.com/"
                              target="_blank"
                              rel="noopener noreferrer"
                              className="w-12 h-12 rounded-full bg-[#181a24] border border-[#2d3142] hover:border-white hover:ring-2 hover:ring-white hover:shadow-[0_0_20px_rgba(234,67,53,0.4)] flex items-center justify-center transition-all hover:scale-110 group cursor-pointer flex-shrink-0"
                              title="Open Google Gmail (mail.google.com)"
                            >
                              <IconGmail className="w-6 h-6 group-hover:scale-110 transition-transform" />
                            </a>

                            <div>
                              <div className="flex items-center gap-2">
                                <a
                                  href="https://mail.google.com/"
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="text-sm font-bold text-white font-sans hover:text-red-400 transition-colors flex items-center gap-1"
                                >
                                  Google Workspace Gmail
                                  <span className="text-xs text-zinc-500 font-normal">↗</span>
                                </a>
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                              </div>
                              <p className="text-xs text-zinc-400 font-mono mt-0.5">
                                Redirect to your official Google inbox at <span className="text-zinc-300">mail.google.com</span>
                              </p>
                            </div>
                          </div>

                          <a
                            href="https://mail.google.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-700 hover:border-white hover:ring-1 hover:ring-white text-zinc-200 hover:text-white text-xs font-mono font-bold tracking-wide uppercase transition-all hover:scale-105 hover:bg-zinc-800 shadow-sm hidden sm:inline-flex items-center gap-1.5"
                          >
                            <span>Launch Gmail</span>
                            <span className="text-red-400">↗</span>
                          </a>
                        </div>
                      </div>

                      {/* Right 1 Col: Recent Activities & Alerts */}
                      <div className="lg:col-span-1">
                        <RecentActivities />
                      </div>
                    </section>
                  </>
                )}

                {activeTab === 'benefits' && (
                  <BenefitsView onBackToOverview={() => setActiveTab('overview')} />
                )}

                {activeTab === 'settings' && (
                  <SettingsView onBackToOverview={() => setActiveTab('overview')} />
                )}
              </div>
            </main>

            {/* FLOATING LOG OUT BUTTON IN BELOW LEFT CORNER with White Outline Pop-up */}
            <div className="fixed bottom-6 left-6 z-40">
              <button
                id="btn-bottom-logout"
                onClick={() => { window.location.href = '/web/session/logout?redirect=/web/login'; }}
                className="hover-pop flex items-center gap-2.5 px-4 py-2.5 bg-[#111218]/95 border border-[#20222c] rounded-2xl text-zinc-300 hover:text-white text-xs font-mono tracking-wider font-semibold uppercase shadow-2xl backdrop-blur-md transition-all"
                title="End Session"
              >
                <IconLogOut className="w-4 h-4 text-zinc-400" />
                <span>Log Out</span>
              </button>
            </div>

            {/* FLOATING CHECK IN BUTTON IN BELOW RIGHT CORNER OUTLINED BY GREEN */}
            <div className="fixed bottom-6 right-6 z-40">
              <button
                id="btn-bottom-checkin"
                onClick={toggleCheckIn}
                className="btn-green-glow flex items-center gap-2.5 px-5 py-3 bg-[#0c1511]/95 text-emerald-300 rounded-2xl text-xs font-mono font-bold tracking-widest uppercase shadow-2xl backdrop-blur-md cursor-pointer group"
                title="Toggle Duty Check-In"
              >
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="group-hover:text-white transition-colors">
                  {currentStatus === 'PRESENT' ? 'CHECKED IN (CLOCK OUT)' : 'CHECK IN NOW'}
                </span>
                <IconUserCheck className="w-4 h-4 text-emerald-400 group-hover:scale-110 transition-transform" />
              </button>
            </div>

            {/* User Profile & Employee Dossier Modal */}
            <UserProfileModal
              isOpen={isProfileModalOpen}
              onClose={() => setIsProfileModalOpen(false)}
              profileData={profileData}
              setProfileData={setProfileData}
            />

            {/* Attendance Punch Modal */}
            <AttendanceModal
              isOpen={isAttendanceModalOpen}
              onClose={() => setIsAttendanceModalOpen(false)}
              currentStatus={currentStatus}
              setCurrentStatus={setCurrentStatus}
            />

            {/* Payroll Data Modal */}
            <PayrollModal
              isOpen={isPayrollModalOpen}
              onClose={() => setIsPayrollModalOpen(false)}
            />

            {/* Leave Request Dispatch Modal */}
            <LeaveRequestModal
              isOpen={isLeaveRequestModalOpen}
              onClose={() => setIsLeaveRequestModalOpen(false)}
              setCurrentStatus={setCurrentStatus}
            />
          </div>
        );
      }

      // Render root
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
